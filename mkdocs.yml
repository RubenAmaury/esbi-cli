site_name: esbi-cli
site_description: Save PDFs and links. Get a wiki of notes you can read instead of the originals.
site_url: https://rubenamaury.github.io/esbi-cli/docs/
repo_url: https://github.com/RubenAmaury/esbi-cli
repo_name: RubenAmaury/esbi-cli
edit_uri: edit/main/docs/

theme:
  name: material
  font: false # system fonts: no request to Google Fonts, works offline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Start here: index.md
  - Learn:
      - Getting started: tutorials/getting-started.md
      - A first week: tutorials/first-week.md
  - Do:
      - "How do I...?": how-to/index.md
      - Install: how-to/install.md
      - Choose how the notes are written: how-to/models.md
      - Add a language for the notes: how-to/add-a-language.md
      - Get sources in: how-to/getting-sources-in.md
      - Manage the queue and old notes: how-to/manage-the-queue.md
      - Read your notes: how-to/read-your-notes.md
      - Ask your wiki: how-to/ask-your-wiki.md
      - "Check the wiki's health": how-to/check-wiki-health.md
      - Export a website: how-to/export-a-website.md
      - Capture email: how-to/email.md
      - Web Clipper and YouTube: how-to/web-clipper.md
      - Run it every night: how-to/nightly-job.md
      - Back up and restore: how-to/backup.md
      - Move to a new Mac: how-to/move-to-a-new-mac.md
      - Update and uninstall: how-to/update-and-uninstall.md
      - Use it without Obsidian: how-to/without-obsidian.md
      - Use it offline: how-to/use-offline.md
      - Troubleshooting: how-to/troubleshooting.md
  - Look up:
      - Commands: reference/cli.md
      - Configuration: reference/configuration.md
      - Vault layout: reference/vault-layout.md
      - The daily index: reference/daily-index.md
  - Understand:
      - Concepts and glossary: explanation/concepts.md
      - FAQ: explanation/faq.md
      - How it works: explanation/how-it-works.md
      - How a note is made: explanation/how-a-note-is-made.md
      - What the worker repairs: explanation/what-the-worker-repairs.md
      - Safety and privacy: explanation/safety-and-privacy.md
      - Why it is built this way: explanation/internals.md
      - Architecture: explanation/architecture.md
      - Retrieval and RAG: explanation/rag-fit.md
      - "Storage: SQLite or something bigger": explanation/storage-fit.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
