name: Docker
# The hermetic build-and-test image and the clean-install smoke image, on both supported Pythons.
# The `test` stage runs ruff and pytest during the build with no network; the `smoke` stage installs
# only the built wheel as a non-root user, and runs again here with no network. See the Dockerfile.
on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    name: docker (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and run the tests (ruff and pytest run inside this build, with no network)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          build-args: PYTHON_VERSION=${{ matrix.python }}
          cache-from: type=gha,scope=test-${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.python }}
      - name: Build the wheel and install only that in a clean image (the first smoke run)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: smoke
          build-args: PYTHON_VERSION=${{ matrix.python }}
          load: true
          tags: esbi-smoke:${{ matrix.python }}
          cache-from: type=gha,scope=smoke-${{ matrix.python }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.python }}
      - name: Run the smoke image again with no network
        run: docker run --rm --network none --memory 1g "esbi-smoke:${{ matrix.python }}"
