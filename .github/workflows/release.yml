name: Release
# Push a tag like v0.1.0 (see scripts/release.sh): the wheel and sdist are built and attached to a
# GitHub release. The Homebrew formula installs from the tag, so it does not need these files.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:  # runs the project's code and its dependencies: no write token here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the release notes are the changelog section of this version
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md --title "$GITHUB_REF_NAME"
